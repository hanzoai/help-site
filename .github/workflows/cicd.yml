# Every knob lives in /hanzo.yml; the build, test and publish are hanzoai/ci's.
name: CI/CD
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: hanzoai/ci/.github/workflows/build.yml@f648887b30513dc00aadf5aa433e11d072517203
    secrets: inherit
